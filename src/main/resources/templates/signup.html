<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>계정 만들기 - Deep Dive Navigator</title>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #fff;
        }
        .signup-card {
            width: 400px;
            padding: 40px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            text-align: center;
        }
        h1 { font-size: 24px; margin-bottom: 8px; font-weight: 500; color: #202124; }
        p { color: #5f6368; margin-bottom: 30px; font-size: 15px; }

        .form-group { margin-bottom: 15px; text-align: left; }
        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
            outline: none;
        }
        input:focus { border: 2px solid #1a73e8; padding: 12px 14px; }

        button {
            width: 100%;
            padding: 12px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
            margin-top: 20px;
            transition: background 0.2s;
        }
        button:hover { background: #1765cc; }

        .footer-link {
            margin-top: 25px;
            font-size: 14px;
            display: block;
            color: #1a73e8;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="signup-card">
    <h1>계정 만들기</h1>
    <p>Google 계정 스타일의 딥다이브 탐험 시작</p>

    <form th:action="@{/signup}" method="post">
        <div class="form-group">
            <input type="text" name="name" placeholder="이름" required>
        </div>
        <div class="form-group">
            <input type="text" name="loginId" placeholder="아이디" required>
        </div>
        <div class="form-group">
            <input type="password" name="password" placeholder="비밀번호" required>
        </div>
        <button type="submit">가입하기</button>
    </form>

    <a href="/login" class="footer-link">이미 계정이 있나요? 로그인</a>
</div>
</body>
</html>
