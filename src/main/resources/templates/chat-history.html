<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AI Deep Dive Learning</title>
    <style>
        :root {
            --sidebar-width: 280px;
            --primary-color: #1a73e8;
            --bg-light: #f8f9fa;
        }

        body { font-family: 'Pretendard', sans-serif; margin: 0; display: flex; height: 100vh; background: white; color: #3c4043; overflow: hidden; }

        /* 1. 사이드바 */
        .sidebar {
            width: var(--sidebar-width); background: var(--bg-light); border-right: 1px solid #dadce0;
            display: flex; flex-direction: column; padding: 15px; flex-shrink: 0; transition: transform 0.3s ease;
        }
        .sidebar.hide { transform: translateX(-100%); width: 0; padding: 0; margin: 0; border: none; }

        .new-chat {
            background: white; border: 1px solid #dadce0; border-radius: 24px; padding: 12px 24px;
            font-weight: 600; cursor: pointer; margin-top: 60px; margin-bottom: 20px;
        }

        /* 2. 페이지 레이아웃 */
        .page-container { display: flex; width: max-content; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .page { width: 50vw; height: 100vh; border-right: 1px solid #eee; flex-shrink: 0; display: flex; flex-direction: column; background: white; }

        /* 3. 채팅창 및 메시지 디자인 */
/* 채팅창: 위에서 아래로 쌓이는 정방향 설정 */
.chat-window {
    flex: 1;
    overflow-y: auto;
    padding: 30px;
    display: flex;
    flex-direction: column; /* reverse 삭제! */
    gap: 20px;
}

/* 개별 메시지 공통 */
.message {
    max-width: 75%;
    padding: 14px 20px;
    border-radius: 18px;
    font-size: 15px;
    position: relative;
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
}

/* 내 질문: 오른쪽 정렬 */
.QUESTION {
    background: #1a73e8;
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
}

/* AI 답변: 왼쪽 정렬 (이제 화면 왼쪽에 나타납니다) */
.ANSWER {
    background: #f1f3f4;
    color: #3c4043;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
}



        /* 4. 입력창 */
        .input-box { padding: 20px 30px; border-top: 1px solid #eee; display: flex; gap: 12px; background: white; }
        .input-box input { flex: 1; padding: 12px 24px; border: 1px solid #dadce0; border-radius: 30px; outline: none; }
        .input-box button { background: #1a73e8; color: white; border: none; border-radius: 50%; width: 44px; height: 44px; cursor: pointer; }

        /* 5. 플로팅 버튼 및 기타 */
        #drag-ask-btn {
            position: fixed; z-index: 9999; background: #202123; color: white;
            border: none; border-radius: 20px; padding: 10px 18px; font-size: 13px;
            font-weight: 600; cursor: pointer; display: none;
        }
        .menu-toggle {
            position: fixed; top: 15px; left: 15px; z-index: 1100; background: white; border: 1px solid #ddd;
            border-radius: 50%; width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .close-btn { background: #fbbc04; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; }

        /* AI 생각 중 말풍선 스타일 보강 */
.loading-message {
    background: #f1f3f4;
    align-self: flex-start;
    color: #1a73e8;
    font-weight: 500;
}

/* 점 세 개가 톡톡 튀는 애니메이션 */
.typing-dots::after {
    content: '...';
    display: inline-block;
    width: 20px;
    animation: dots 1.5s steps(4, end) infinite;
    vertical-align: bottom;
}

@keyframes dots {
    0%, 20% { content: ''; }
    40% { content: '.'; }
    60% { content: '..'; }
    80% { content: '...'; }
}

/* 입력창이 비활성화되었을 때의 시각적 피드백 */
input:disabled {
    background-color: #f8f9fa;
    cursor: not-allowed;
}

        /* 사이드바 개별 항목 버튼 스타일 */
/* 사이드바 개별 항목 버튼 스타일 (수정됨) */
.session-button {
    width: 100%;
    padding: 10px 15px;
    background-color: white; /* 배경을 흰색으로 */
    border: 1px solid #dadce0; /* 테두리 추가 */
    border-radius: 8px;
    color: #3c4043; /* 글자색을 어두운 회색으로 */
    text-align: left;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 8px;
    display: block;
}

/* 마우스를 올렸을 때(Hover) 효과 */
.session-button:hover {
    background-color: #e8f0fe; /* 제미나이풍 연한 파란색 */
    border-color: #1a73e8;
}

/* 텍스트 생략 처리 (...) */
.session-text {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 14px;
    font-weight: 500;
}
    </style>
</head>
<body>

<aside id="sidebar" class="sidebar">
    <button class="new-chat" onclick="location.reload()">+ New Chat</button>

    <div id="sessionItems" class="session-list">
        <div th:each="chatSession : ${sessions}" class="session-item">
            <button class="session-button" th:onclick="|loadChatHistory(${chatSession.id})|">
                <span class="session-text" th:text="${chatSession.content}">
                    제미나이처럼 대화 제목이 여기 뜹니다.
                </span>
            </button>
        </div>
    </div>
</aside>

<button class="menu-toggle" onclick="toggleSidebar()">☰</button>
<button id="drag-ask-btn">💡 이 내용으로 꼬리물기</button>

<div class="page-container" id="pageContainer">
    <div class="page" id="mainPage">
        <div class="page-header">
            <strong style="flex: 1;">🚀 Deep Dive Navigator (Member ID: <span id="memberId" th:text="${memberId}">1</span>)</strong>
        </div>
        <div id="mainChatWindow" class="chat-window">
            <div th:each="chat : ${history}"
                 th:classappend="${chat.nodeType == 'QUESTION' ? 'QUESTION' : 'ANSWER'}"
                 class="message" th:attr="data-id=${chat.id}">
                <strong th:text="${chat.nodeType == 'QUESTION' ? '나' : 'Gemini AI'}"></strong>
                <p th:text="${chat.content}" style="margin: 4px 0 0 0;"></p>
            </div>
        </div>
        <div class="input-box">
            <input type="text" id="mainInput" placeholder="Enter your question here...">
            <button onclick="sendQuestion('main','','main')">➔</button>
        </div>
    </div>
</div>

<script>
    let pageStack = ['mainPage'];
    let currentPageIndex = 0;

    let branchNodeMap = {}; //{pageId: nodeId}

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('hide'); }

    function updatePagePosition() {
        const container = document.getElementById('pageContainer');
        const sidebar = document.getElementById('sidebar');
        container.style.transform = `translateX(-${currentPageIndex * 50}vw)`;
        if (currentPageIndex > 0) sidebar.classList.add('hide');
        else sidebar.classList.remove('hide');
    }

    // 드래그 감지
    document.addEventListener('mouseup', function(e) {
        const selection = window.getSelection();
        const text = selection.toString().trim();
        const btn = document.getElementById('drag-ask-btn');
        if (text.length > 2) {
            const messageEl = selection.anchorNode.parentElement.closest('.message.ANSWER');
            if (messageEl) {
                const nodeId = messageEl.getAttribute('data-id');
                btn.style.display = 'block';
                btn.style.left = e.clientX + 'px';
                btn.style.top = (e.clientY - 50) + 'px';
                btn.onclick = () => {
                    document.getElementById('sidebar').classList.add('hide');
                    openBranch(nodeId, text);
                    btn.style.display = 'none';
                    selection.removeAllRanges();
                };
            }
        } else {
            if (e.target.id !== 'drag-ask-btn') btn.style.display = 'none';
        }
    });

    async function openBranch(parentId, text) {
        const newPageId = `branch-${parentId}-${Date.now()}`;
        branchNodeMap[newPageId] = parentId;
        const newPage = document.createElement('div');
        newPage.className = 'page';
        newPage.id = newPageId;
        newPage.innerHTML = `
            <div class="page-header">
                <button onclick="goBackPage()" style="border:none; background:none; cursor:pointer;">←</button>
                <span style="flex:1">🔍 Deep Dive: ${text.substring(0,10)}...</span>
                <button class="close-btn" onclick="closeCurrentBranch()">×</button>
            </div>
            <div class="chat-window" id="window-${newPageId}"></div>
            <div class="input-box">
                <input type="text" id="input-${newPageId}" placeholder="더 깊게 질문...">
                <button onclick="sendQuestion('branch', '${parentId}', '${newPageId}')">➔</button>
            </div>
        `;
        document.getElementById('pageContainer').appendChild(newPage);
        pageStack.push(newPageId);
        const branchInput = document.getElementById(`input-${newPageId}`);
        branchInput.value = `"${text}" : `;
        branchInput.focus();

        branchInput.onkeydown = (e) => {
            if (e.key ==='Enter') sendQuestion('branch',parentId,newPageId);
        };

        const response = await fetch(`/api/chat/sub-history/${parentId}`);
        const data = await response.json();
        const windowEl = document.getElementById(`window-${newPageId}`);
        data.forEach(chat => appendMessage(windowEl, chat));
        currentPageIndex = pageStack.length - 1;
        updatePagePosition();
    }

    async function sendQuestion(type, parentId, pageId) {
    const inputId = type === 'main' ? 'mainInput' : `input-${pageId}`;
    const input = document.getElementById(inputId);
    const content = input.value.trim();
    if (!content) return;

    const windowId = type === 'main' ? 'mainChatWindow' : `window-${pageId}`;
    const windowEl = document.getElementById(windowId);

    // 내 질문 추가
    appendMessage(windowEl, {nodeType: 'QUESTION', content: content});

    // 입력창 잠금
    input.value = "AI가 생각 중...";
    input.disabled = true;

    // 로딩 말풍선 추가
    const loadingId = `loading-${Date.now()}`;
    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'message ANSWER loading-message';
    loadingDiv.id = loadingId;
    loadingDiv.innerHTML = `<strong>Gemini AI</strong><p class="typing-dots">분석 중</p>`;
    windowEl.appendChild(loadingDiv);
    windowEl.scrollTop = windowEl.scrollHeight;

    try {
        const memberId = document.getElementById('memberId').textContent.trim();
        const url = `/api/chat/ask?memberId=${memberId}&content=${encodeURIComponent(content)}&parentId=${parentId || ''}`;
        const response = await fetch(url, { method: 'POST' });

        // 답변 오면 로딩 제거
        loadingDiv.remove();

        if (response.ok) {
            const data = await response.json();
            const lastAiResponse = Array.isArray(data) ? data[data.length - 1] : data;
            appendMessage(windowEl, lastAiResponse);
            if (type === 'branch') updateBranchAttributes(pageId, lastAiResponse.id);

            if (type === 'main' && !parentId) {
                loadSessions();
            }
        }
    } catch (e) {
        loadingDiv.remove();
        console.error(e);
    } finally {
        input.value = "";
        input.disabled = false;
        input.focus();
    }
    }

    function updateBranchAttributes(pageId, nextParentId) {
        const input = document.getElementById(`input-${pageId}`);
        const btn = input.nextElementSibling;
        input.onkeydown = (e) => { if(e.key === 'Enter') sendQuestion('branch', nextParentId, pageId); };
        btn.onclick = () => sendQuestion('branch', nextParentId, pageId);
    }

    function goBackPage() { if (currentPageIndex > 0) { currentPageIndex--; updatePagePosition(); } }

    async function closeCurrentBranch() {
        if (currentPageIndex <= 0) return;

        const pageId = pageStack[currentPageIndex];
        const nodeId = branchNodeMap[pageId];

        if(!nodeId) return;

        //1. 자식 브랜치 있는지 확인
        const checkResponse = await fetch(`/api/chat/has-children/${nodeId}`);
        const hasChildren = await checkResponse.json();

        //2. 자식 있으면 경고창
        if(hasChildren) {
            const confirmed = confirm(
                "해당 페이지는 브랜치를 가지고 있습니다.\n" +
                "지우시겠습니까?\n" +
                "이 브랜치에서 파생된 질문들도 같이 삭제됩니다."
            );
            if (!confirmed) return;

            //자식 포함 닫기
            // 수정된 코드
            await fetch(`/api/chat/close-with-children/${nodeId}`, {method: 'POST'});
        } else {
            //본인만 닫기
            await fetch(`/api/chat/close/${nodeId}`, {method: 'POST'});
        }

        const pagesToRemove = pageStack.splice(currentPageIndex);

        pagesToRemove.forEach(pid => {
            delete branchNOdeMap[pid];
            const el = document.getElementById(pid);
            if (el) setTimeout(() => el.remove(), 400);
        });

        currentPageIndex--;
        updatePagePosition();
    }

    // appendMessage 함수 보정: nodeType에 따라 정확한 클래스 부여
    function appendMessage(el, chat) {
        const div = document.createElement('div');
        const className = chat.nodeType === 'QUESTION' ? 'QUESTION' : 'ANSWER';
        div.className = `message ${className}`;
        div.setAttribute('data-id', chat.id || '');
        div.innerHTML = `<strong>${chat.nodeType === 'QUESTION' ? '나' : 'Gemini AI'}</strong><p>${chat.content}</p>`;
        el.appendChild(div);
        el.scrollTop = el.scrollHeight;
    }

    document.getElementById('mainInput').onkeydown = (e) => { if(e.key === 'Enter') sendQuestion('main','','main'); };

    // 페이지 로드 시 최하단으로 스크롤 이동
    window.onload = function() {
        const mainChat = document.getElementById('mainChatWindow');
        if (mainChat) {
            mainChat.scrollTop = mainChat.scrollHeight;
        }
        loadSessions(); // 기존 세션 로드 함수 실행
    };

    async function loadSessions() {
    const memberId = document.getElementById('memberId').textContent.trim();
    const response = await fetch(`/api/chat/sessions/${memberId}`);
    if (response.ok) {
        const sessions = await response.json();
        const sessionList = document.getElementById('sessionItems');
        sessionList.innerHTML = ''; // 기존 내용 삭제

        sessions.forEach(s => {
            // 1. 감싸는 div 생성
            const wrapper = document.createElement('div');
            wrapper.className = 'session-item';

            // 2. 버튼 생성 (제미나이 스타일 버튼 구조)
            const btn = document.createElement('button');
            btn.className = 'session-button';
            btn.onclick = () => loadChatHistory(s.id); // 클릭 이벤트 연결

            // 3. 텍스트를 담을 span 생성
            const span = document.createElement('span');
            span.className = 'session-text';
            span.innerText = s.content;

            btn.appendChild(span);
            wrapper.appendChild(btn);
            sessionList.appendChild(wrapper);
        });
    }
}

// 버튼 클릭 시 메인 창 내용을 바꿔주는 함수 (추가 필요)
async function loadChatHistory(nodeId) {
    const windowEl = document.getElementById('mainChatWindow');
    windowEl.innerHTML = '<p style="text-align:center; padding:20px; color:#1a73e8;">대화 불러오는 중...</p>';

    try {
        const response = await fetch(`/api/chat/sub-history/${nodeId}`);
        if (response.ok) {
            const data = await response.json();
            windowEl.innerHTML = ''; // 초기화
            data.forEach(chat => appendMessage(windowEl, chat));
            windowEl.scrollTop = windowEl.scrollHeight;
        }
    } catch (e) {
        console.error("로드 실패:", e);
    }
}

</script>
</body>
</html>
